name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api

    env:
      POSTGRES_SERVER: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_db
      SECRET_KEY: test_secret_key
      REDIS_HOST: localhost
      GEMINI_API_KEY: dummy_key
      QDRANT_HOST: localhost

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-asyncio

    - name: Run Backend Unit/Integration Tests
      run: |
        pytest apps/api/tests/

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Lint
      run: npm run lint

    - name: Run Frontend Tests
      run: |
        echo "No dedicated frontend tests found in package.json. Running lint as placeholder."
        npm run lint # Placeholder: Replace with actual frontend tests (e.g., `npm test` or `npm run cypress`) when available.

  e2e-load-test:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies for load test
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp

    - name: Decrypt .env file for docker-compose
      run: openssl enc -d -aes-256-cbc -in infra/.env.encrypted -out infra/.env -k ${{ secrets.ENV_PASSPHRASE }}

    - name: Start services with Docker Compose
      run: docker-compose -f infra/docker-compose.yml up -d
      
    - name: Wait for API to be ready
      run: |
        for i in $(seq 1 10); do
          curl -s http://localhost:8000/api/v1/health && break
          echo "Waiting for API... ($i/10)"
          sleep 5
        done
        curl http://localhost:8000/api/v1/health

    - name: Run Load Test
      run: python apps/api/load_test.py

    - name: Stop services
      run: docker-compose -f infra/docker-compose.yml down

  docker-build:
    needs: [backend-test, frontend-build, e2e-load-test] # Add e2e-load-test as a dependency
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Decrypt .env file
      run: openssl enc -d -aes-256-cbc -in infra/.env.encrypted -out infra/.env -k ${{ secrets.ENV_PASSPHRASE }}
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./apps/api
        file: ./apps/api/Dockerfile
        push: false
        tags: listinglens-backend:latest
        build-args: |
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push worker
      uses: docker/build-push-action@v5
      with:
        context: ./apps/api
        file: ./apps/api/Dockerfile
        push: false
        tags: listinglens-worker:latest
        build-args: |
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./apps/web
        file: ./apps/web/Dockerfile
        push: false
        tags: listinglens-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
